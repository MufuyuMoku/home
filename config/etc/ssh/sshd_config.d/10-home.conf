# Project HOME: SSH hanya lewat key.
# File ini di-Include SEBELUM baris-baris sshd_config utama; di sshd nilai pertama yang berlaku,
# jadi nilai di sini mengalahkan `PermitRootLogin yes` di /etc/ssh/sshd_config.
# Membatalkan: hapus file ini lalu `systemctl reload ssh`.
PermitRootLogin prohibit-password
PasswordAuthentication no
